name: Build KING Detection APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build KING Detection
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p output
          find . -type f -path "*/build/outputs/apk/*" \
            -name "*debug.apk" \
            -exec cp {} output/KING-Detection.apk \;
          test -s output/KING-Detection.apk

      - name: Upload KING Detection APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-Detection-Android
          path: output/KING-Detection.apk
          retention-days: 30
          if-no-files-found: error
