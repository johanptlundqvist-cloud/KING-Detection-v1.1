name: Build KING Detection APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract KING Detection project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q KING-Detection-GitHub.zip -d extracted
          echo "Project files:"
          find extracted -maxdepth 4 -type f | head -80

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT" ]; then
            echo "::error::No Android Gradle project found inside ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          APK=$(find extracted -type f -name '*debug.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced"
            exit 1
          fi
          cp "$APK" output/KING-Detection.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-Detection-Android
          path: output/KING-Detection.apk
          if-no-files-found: error
          retention-days: 30
